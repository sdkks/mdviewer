<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
    {{THEME_CSS}}
}

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--color-fg);
    background-color: var(--color-bg);
    margin: 0;
    padding: 32px 48px;
    word-wrap: break-word;
}

h1, h2, h3, h4, h5, h6 {
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
}

h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }

p { margin-top: 0; margin-bottom: 16px; }

a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; }

code {
    font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 85%;
    background-color: var(--color-code-bg);
    padding: 0.2em 0.4em;
    border-radius: 6px;
}

pre {
    background-color: var(--color-code-bg);
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
    line-height: 1.45;
}

pre code {
    background: none;
    padding: 0;
    font-size: 85%;
}

/* Override highlight.js background to match theme */
.hljs {
    background: var(--color-code-bg) !important;
}

.hljs-addition, .hljs-deletion {
    background: transparent !important;
}

/* Mermaid diagrams: reset pre styling so SVG renders cleanly */
pre.mermaid {
    background: none;
    border-radius: 0;
    padding: 0;
    overflow: hidden;
    text-align: center;
    cursor: grab;
    user-select: none;
    outline: none;
    width: 100%;
}

.mermaid-error {
    user-select: text;
}
pre.mermaid:focus-visible {
    outline: 2px solid var(--color-accent, var(--color-link));
    outline-offset: 2px;
}

/* Mermaid error diagnostic box */
.mermaid-error {
    border: 1px solid var(--color-mermaid-error);
    border-radius: 6px;
    padding: 12px 16px;
    margin: 8px 0;
    color: var(--color-mermaid-error);
    background: var(--color-code-bg);
    background: color-mix(in srgb, var(--color-mermaid-error) 6%, var(--color-bg));
}

.mermaid-error h4 {
    margin: 0 0 8px 0;
    font-size: 1.05em;
    font-weight: 600;
}

.mermaid-error pre,
.mermaid-error pre code {
    color: var(--color-fg);
}

.mermaid-error .mermaid-error-message {
    margin: 0 0 8px 0;
    font-size: 0.95em;
}

.mermaid-error .mermaid-error-hash {
    margin: 0 0 12px 0;
    font-size: 0.85em;
    opacity: 0.7;
}

.mermaid-error pre {
    background-color: var(--color-code-bg);
    margin: 0;
    text-align: left;
}

blockquote {
    margin: 0 0 16px 0;
    padding: 0 1em;
    color: var(--color-blockquote-fg);
    border-left: 0.25em solid var(--color-blockquote-border);
}

hr {
    height: 0.25em;
    padding: 0;
    margin: 24px 0;
    background-color: var(--color-hr);
    border: 0;
    border-radius: 2px;
}

ul, ol {
    margin-top: 0;
    margin-bottom: 16px;
    padding-left: 2em;
}

li + li { margin-top: 0.25em; }

table {
    border-collapse: collapse;
    border-spacing: 0;
    margin-bottom: 16px;
    width: auto;
    overflow: auto;
}

th, td {
    padding: 6px 13px;
    border: 1px solid var(--color-border);
}

th { font-weight: 600; }

tr:nth-child(2n) { background-color: var(--color-code-bg); }

img { max-width: 100%; height: auto; }

input[type="checkbox"] { margin-right: 0.5em; }

/* Internal markdown link cursor */
a[href$=".md"], a[href*=".md#"], a[href*=".md?"],
a[href$=".markdown"], a[href*=".markdown#"], a[href*=".markdown?"],
a[href$=".mdown"], a[href*=".mdown#"], a[href*=".mdown?"],
a[href$=".mkd"], a[href*=".mkd#"], a[href*=".mkd?"] {
    cursor: pointer;
}

/* Visual distinction for internal Markdown links */
a[href$=".md"]::after,
a[href$=".markdown"]::after,
a[href$=".mdown"]::after,
a[href$=".mkd"]::after {
    content: " 📄";
    font-size: 0.75em;
    opacity: 0.6;
}

/* Footnotes */
.footnotes {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
    font-size: 14px;
}
.footnotes ol {
    padding-left: 1.5em;
}
.footnotes li {
    color: var(--color-blockquote-fg);
}
.footnotes li p {
    margin-bottom: 4px;
}
a[href^="#fn"], a[href^="#fnref"] {
    text-decoration: underline;
    font-size: 12px;
    vertical-align: super;
}
a[href^="#fnref"] {
    display: inline-block;
    padding: 6px 8px;
    margin: -4px -2px;
    font-size: 12px;
    text-decoration: none;
}
a[href^="#fnref"]:hover {
    text-decoration: underline;
}

/* Focus-visible for keyboard accessibility */
a:focus-visible, pre.mermaid:focus-visible {
    outline: 2px solid var(--color-accent, var(--color-link));
    outline-offset: 2px;
}

/* YAML frontmatter metadata */
.frontmatter-card,
.frontmatter-error {
    border: 1px solid var(--color-border);
    border-radius: 6px;
    margin: 0 0 16px 0;
    overflow: hidden;
    background: color-mix(in srgb, var(--color-code-bg) 55%, var(--color-bg));
}

.frontmatter-card {
    color: var(--color-fg);
}

.frontmatter-title,
.frontmatter-error-title {
    padding: 8px 12px;
    font-weight: 600;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-code-bg);
}

.frontmatter-table {
    width: 100%;
    margin: 0;
    table-layout: fixed;
    border-collapse: collapse;
}

.frontmatter-table th,
.frontmatter-table td {
    padding: 6px 12px;
    border: 1px solid var(--color-border);
    vertical-align: top;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.frontmatter-table > tbody > tr:first-child > th,
.frontmatter-table > tbody > tr:first-child > td {
    border-top: 0;
}

.frontmatter-table th {
    width: clamp(8rem, 25%, 14rem);
    text-align: left;
    font-weight: 600;
}

.frontmatter-value-list {
    margin: 0;
    padding-left: 1.5em;
}

.frontmatter-value-list li + li {
    margin-top: 0.15em;
}

.frontmatter-null {
    color: var(--color-blockquote-fg);
    font-style: italic;
}

.frontmatter-json-fallback {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
    padding: 8px;
}

.frontmatter-error {
    border-color: var(--color-mermaid-error);
    background: color-mix(in srgb, var(--color-mermaid-error) 8%, var(--color-bg));
}

.frontmatter-error-title {
    color: var(--color-mermaid-error);
    border-bottom-color: color-mix(in srgb, var(--color-mermaid-error) 35%, var(--color-border));
}

.frontmatter-error p,
.frontmatter-error details {
    margin: 8px 12px;
}

.frontmatter-error-message {
    color: var(--color-fg);
}

.frontmatter-error pre {
    margin: 8px 0 0 0;
    white-space: pre-wrap;
    overflow-x: auto;
}
</style>
<style>{{HIGHLIGHT_CSS}}</style>
</head>
<body>
<div id="content"></div>
<script>{{JS_YAML_JS}}</script>
<script>{{MARKED_JS}}</script>
<script>{{MERMAID_JS}}</script>
<script>{{MARKED_FOOTNOTE_JS}}</script>
<script>{{SVG_PAN_ZOOM_JS}}</script>
<script>{{HIGHLIGHT_JS}}</script>
<script>
    // Content is from local user files rendered in a sandboxed WKWebView

    // FRONTMATTER_HELPERS_START
    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function splitLeadingYamlFrontmatter(markdown) {
        const text = String(markdown == null ? '' : markdown);
        const startOffset = text.charCodeAt(0) === 0xFEFF ? 1 : 0;

        function readLine(offset) {
            let end = offset;
            while (end < text.length && text[end] !== '\n' && text[end] !== '\r') {
                end += 1;
            }
            let next = end;
            if (next < text.length) {
                if (text[next] === '\r' && text[next + 1] === '\n') {
                    next += 2;
                } else {
                    next += 1;
                }
            }
            return { value: text.slice(offset, end), start: offset, end: end, next: next };
        }

        const firstLine = readLine(startOffset);
        if (firstLine.value !== '---') {
            return { hasFrontmatter: false, rawBlock: '', yamlText: '', bodyText: text };
        }

        const yamlStart = firstLine.next;
        let cursor = yamlStart;
        let closingLine = null;
        while (cursor < text.length) {
            const line = readLine(cursor);
            if (line.value === '---') {
                closingLine = line;
                break;
            }
            cursor = line.next;
        }

        if (!closingLine) {
            return { hasFrontmatter: false, rawBlock: '', yamlText: '', bodyText: text };
        }

        return {
            hasFrontmatter: true,
            rawBlock: text.slice(0, closingLine.end),
            yamlText: text.slice(yamlStart, closingLine.start),
            bodyText: text.slice(closingLine.next)
        };
    }

    function parseYamlFrontmatter(yamlText) {
        if (typeof jsyaml === 'undefined' || !jsyaml || typeof jsyaml.load !== 'function') {
            return { ok: false, code: 'parser-missing', error: 'YAML parser is unavailable.' };
        }
        try {
            const value = jsyaml.load(yamlText);
            return { ok: true, value: value === undefined ? null : value };
        } catch (err) {
            return {
                ok: false,
                code: 'invalid',
                error: (err && err.message) ? err.message : String(err)
            };
        }
    }

    function isPlainObject(value) {
        return Object.prototype.toString.call(value) === '[object Object]';
    }

    function isEmptyMetadata(value) {
        return value == null || (isPlainObject(value) && Object.keys(value).length === 0);
    }

    function renderFrontmatterValue(value, depth) {
        const maxDepth = 3;
        if (value == null) {
            return '<span class="frontmatter-null">null</span>';
        }
        if (value instanceof Date) {
            const time = value.getTime();
            return escapeHtml(Number.isNaN(time) ? String(value) : value.toISOString());
        }
        if (Array.isArray(value)) {
            if (depth >= maxDepth) {
                return renderFrontmatterJsonFallback(value);
            }
            if (value.length === 0) {
                return '<span class="frontmatter-null">empty list</span>';
            }
            return '<ul class="frontmatter-value-list">' + value.map(function(item) {
                return '<li>' + renderFrontmatterValue(item, depth + 1) + '</li>';
            }).join('') + '</ul>';
        }
        if (isPlainObject(value)) {
            const keys = Object.keys(value);
            if (keys.length === 0) {
                return '<span class="frontmatter-null">empty object</span>';
            }
            if (depth >= maxDepth) {
                return renderFrontmatterJsonFallback(value);
            }
            return '<table class="frontmatter-table"><tbody>' + keys.map(function(key) {
                return '<tr><th scope="row">' + escapeHtml(key) + '</th><td>' + renderFrontmatterValue(value[key], depth + 1) + '</td></tr>';
            }).join('') + '</tbody></table>';
        }
        return escapeHtml(String(value));
    }

    function renderFrontmatterJsonFallback(value) {
        let serialized;
        try {
            serialized = JSON.stringify(value, function(key, item) {
                if (item instanceof Date) {
                    const time = item.getTime();
                    return Number.isNaN(time) ? String(item) : item.toISOString();
                }
                return item;
            }, 2);
        } catch (err) {
            serialized = String(value);
        }
        return '<pre class="frontmatter-json-fallback"><code>' + escapeHtml(serialized) + '</code></pre>';
    }

    function renderFrontmatterMetadata(value) {
        if (isEmptyMetadata(value)) {
            return '';
        }
        const tableValue = isPlainObject(value) ? value : { value: value };
        const rows = Object.keys(tableValue).map(function(key) {
            return '<tr><th scope="row">' + escapeHtml(key) + '</th><td>' + renderFrontmatterValue(tableValue[key], 1) + '</td></tr>';
        }).join('');
        return '<section class="frontmatter-card" aria-labelledby="frontmatter-title">' +
            '<div id="frontmatter-title" class="frontmatter-title" role="heading" aria-level="2">Metadata</div>' +
            '<table class="frontmatter-table"><tbody>' + rows + '</tbody></table>' +
            '</section>';
    }

    function renderFrontmatterError(error, rawBlock, status) {
        const title = status === 'parser-missing' ? 'Frontmatter parser unavailable' : 'Frontmatter parse error';
        const message = error || (status === 'parser-missing' ? 'YAML parser is unavailable.' : 'The YAML frontmatter could not be parsed.');
        return '<section class="frontmatter-error" role="alert" aria-labelledby="frontmatter-error-title">' +
            '<div id="frontmatter-error-title" class="frontmatter-error-title" role="heading" aria-level="2">' + escapeHtml(title) + '</div>' +
            '<p>The document body is rendered below, but the YAML frontmatter metadata could not be displayed.</p>' +
            '<p class="frontmatter-error-message">' + escapeHtml(message) + '</p>' +
            '<details open><summary>Original frontmatter</summary><pre><code>' + escapeHtml(rawBlock) + '</code></pre></details>' +
            '</section>';
    }

    function processFrontmatter(markdown) {
        const split = splitLeadingYamlFrontmatter(markdown);
        if (!split.hasFrontmatter) {
            return { markdown: split.bodyText, html: '', status: 'none' };
        }
        const parsed = parseYamlFrontmatter(split.yamlText);
        if (!parsed.ok) {
            const status = parsed.code === 'parser-missing' ? 'parser-missing' : 'invalid';
            return {
                markdown: split.bodyText,
                html: renderFrontmatterError(parsed.error, split.rawBlock, status),
                status: status,
                error: parsed.error,
                rawBlock: split.rawBlock
            };
        }
        if (isEmptyMetadata(parsed.value)) {
            return { markdown: split.bodyText, html: '', status: 'empty', metadata: parsed.value };
        }
        return {
            markdown: split.bodyText,
            html: renderFrontmatterMetadata(parsed.value),
            status: 'parsed',
            metadata: parsed.value
        };
    }
    // FRONTMATTER_HELPERS_END

    // Map mdviewer theme id → mermaid theme name
    const MERMAID_THEME_MAP = {
        'github-light':    'default',
        'solarized-light': 'default',
        'github-dark':     'dark',
        'dracula':         'dark',
        'solarized-dark':  'dark',
        'monokai':         'dark',
        'nord':            'dark',
    };
    const themeId = '{{THEME_ID}}';
    const mermaidTheme = MERMAID_THEME_MAP[themeId] || 'default';

    mermaid.initialize({ startOnLoad: false, theme: mermaidTheme });

    // Override marked renderer: emit <pre class="mermaid"> for mermaid fences
    marked.use({
        renderer: {
            code({ text, lang }) {
                if (lang === 'mermaid') {
                    return `<pre class="mermaid">${text}</pre>`;
                }
                return false;
            }
        }
    });

    // Footnote support
    if (typeof markedFootnote !== 'undefined') {
        marked.use(markedFootnote({
            description: "Footnotes",
            placement: "document"
        }));
    }

    const md = `{{MARKDOWN_CONTENT}}`;
    const frontmatterResult = processFrontmatter(md);
    document.getElementById('content').innerHTML = frontmatterResult.html + marked.parse(frontmatterResult.markdown);

    // Ensure all headers have anchor IDs for sidebar navigation
    (function() {
        function slugify(text) {
            return text.toLowerCase().trim()
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '');
        }
        document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function(el) {
            if (!el.id) {
                el.id = slugify(el.textContent || '');
            }
        });
    })();

    const fitDiagrams = {{FIT_DIAGRAMS}};

    (async function() {
        const blocks = document.querySelectorAll('pre.mermaid');
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            const definition = block.textContent || '';
            const id = 'mermaid-' + i;
            // Make diagram focusable for keyboard accessibility
            block.setAttribute('tabindex', '0');
            try {
                const result = await mermaid.render(id, definition);
                // Mermaid v11+ renders syntax errors as an SVG instead of throwing.
                // Detect the error SVG and route to our themed error handler.
                if (result.svg && result.svg.includes('class="error-icon"')) {
                    throw new Error('Syntax error in text');
                }
                block.innerHTML = result.svg;

                const svg = block.querySelector('svg');
                if (svg && typeof svgPanZoom !== 'undefined') {
                    // Remove Mermaid's intrinsic max-width lock so width="100%" can work.
                    // Mermaid injects style="max-width: {viewBoxWidth}px" which hard-codes
                    // the diagram to its natural pixel size.
                    svg.style.maxWidth = '';

                    const vb = svg.viewBox.baseVal;
                    if (fitDiagrams && vb && vb.width > 0 && vb.height > 0) {
                        // Fit to container width; height is proportional.
                        // The container div wraps the full-height SVG so tall diagrams
                        // remain readable and panning has a large canvas to work with.
                        const containerW = block.clientWidth;
                        const scale = containerW / vb.width;
                        svg.setAttribute('width', containerW);
                        svg.setAttribute('height', vb.height * scale);
                    } else {
                        // Fit disabled: natural size, capped at container width.
                        const containerW = block.clientWidth;
                        const scale = Math.min(containerW / vb.width, 1);
                        svg.setAttribute('width', vb.width * scale);
                        svg.setAttribute('height', vb.height * scale);
                    }

                    const panZoom = svgPanZoom(svg, {
                        zoomEnabled: true,
                        controlIconsEnabled: false,
                        fit: fitDiagrams,
                        center: fitDiagrams,
                        minZoom: 0.1,
                        maxZoom: 10
                    });
                    block._panZoom = panZoom;

                    // Cursor feedback during drag (svg-pan-zoom v3.x uses callbacks, not .on())
                    block.addEventListener('mousedown', function() {
                        block.style.cursor = 'grabbing';
                    });
                    block.addEventListener('mouseup', function() {
                        block.style.cursor = 'grab';
                    });

                    // Gate scroll-wheel zoom on Cmd/Ctrl key to prevent page-scroll hijacking
                    block.addEventListener('wheel', function(e) {
                        if (!e.metaKey && !e.ctrlKey) {
                            e.stopPropagation();
                        }
                    }, true);

                    // Keyboard accessibility for zoom/pan
                    block.addEventListener('keydown', function(e) {
                        if (!block._panZoom) return;
                        const panStep = 30;
                        switch(e.key) {
                            case '+':
                            case '=':
                                block._panZoom.zoomIn();
                                e.preventDefault();
                                break;
                            case '-':
                            case '_':
                                block._panZoom.zoomOut();
                                e.preventDefault();
                                break;
                            case 'ArrowUp':
                                block._panZoom.panBy({x: 0, y: panStep});
                                e.preventDefault();
                                break;
                            case 'ArrowDown':
                                block._panZoom.panBy({x: 0, y: -panStep});
                                e.preventDefault();
                                break;
                            case 'ArrowLeft':
                                block._panZoom.panBy({x: panStep, y: 0});
                                e.preventDefault();
                                break;
                            case 'ArrowRight':
                                block._panZoom.panBy({x: -panStep, y: 0});
                                e.preventDefault();
                                break;
                            case '0':
                                block._panZoom.fit();
                                block._panZoom.center();
                                e.preventDefault();
                                break;
                            case 'Escape':
                                block._panZoom.fit();
                                block._panZoom.center();
                                e.preventDefault();
                                break;
                        }
                    });
                }

                if (result.bindFunctions) {
                    result.bindFunctions(block);
                }
            } catch (err) {
                // Mermaid v11 leaks an error SVG div to the DOM before throwing.
                // Clean it up so only our themed error box remains.
                const leakedDiv = document.getElementById('d' + id);
                if (leakedDiv) leakedDiv.remove();

                const message = (err && err.message) ? err.message : String(err);
                const hash = (err && err.hash) ? (typeof err.hash === 'string' ? err.hash : JSON.stringify(err.hash)) : '';
                function escapeHtml(str) {
                    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }
                const escapedMessage = escapeHtml(message);
                const escapedHash = escapeHtml(hash);
                const escapedSource = escapeHtml(definition);
                block.innerHTML = `
                    <div class="mermaid-error">
                        <h4>⚠️ Mermaid Diagram Error</h4>
                        <p class="mermaid-error-message">${escapedMessage}</p>
                        ${escapedHash ? `<p class="mermaid-error-hash">Hash: ${escapedHash}</p>` : ''}
                        <pre><code>${escapedSource}</code></pre>
                    </div>
                `;
            }
        }

        // Apply syntax highlighting after parsing
        if (typeof hljs !== 'undefined') {
            hljs.highlightAll();
        }

        // Add tooltip to internal Markdown links
        const internalLinkSelectors = [
            'a[href$=".md"]',
            'a[href$=".markdown"]',
            'a[href$=".mdown"]',
            'a[href$=".mkd"]'
        ];
        internalLinkSelectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(link => {
                link.title = 'Open in MDViewer';
            });
        });

        // Notify Swift of the diagram count
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mermaidCount) {
            const count = document.querySelectorAll('pre.mermaid svg').length;
            window.webkit.messageHandlers.mermaidCount.postMessage(count);
        }

        // Notify Swift of the current document's H1/H2 header outline
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mermaidH1Headers) {
            function slugify(text) {
                return text.toLowerCase().trim()
                    .replace(/\s+/g, '-')
                    .replace(/[^a-z0-9-]/g, '');
            }
            const headers = [];
            let currentH1 = null;
            document.querySelectorAll('h1, h2').forEach(function(el) {
                var id = el.id || slugify(el.textContent || '');
                if (el.tagName === 'H1') {
                    currentH1 = {text: el.textContent || '', id: id, h2s: []};
                    headers.push(currentH1);
                } else if (el.tagName === 'H2' && currentH1) {
                    currentH1.h2s.push({text: el.textContent || '', id: id});
                }
            });
            console.log('[mermaidH1Headers] posting', headers.length, 'H1s');
            window.webkit.messageHandlers.mermaidH1Headers.postMessage(headers);
        }
    })();

    // Inline computed CSS styles into an SVG clone so it renders correctly
    // outside the browser (e.g. image editors, other SVG viewers).
    function inlineSVGStyles(svg) {
        const clone = svg.cloneNode(true);
        const elements = clone.querySelectorAll('*');
        elements.forEach(function(el) {
            const computed = window.getComputedStyle(el);
            const props = ['fill', 'stroke', 'color', 'font-family', 'font-size',
                           'font-weight', 'text-anchor', 'dominant-baseline',
                           'stroke-width', 'stroke-dasharray'];
            let inline = el.getAttribute('style') || '';
            props.forEach(function(prop) {
                const val = computed.getPropertyValue(prop);
                if (val && val !== 'none' && val !== 'auto' && val !== 'normal' &&
                    !inline.includes(prop + ':')) {
                    inline += (inline ? '; ' : '') + prop + ': ' + val;
                }
            });
            if (inline) el.setAttribute('style', inline);
        });
        if (!clone.getAttribute('xmlns')) {
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        }
        const rect = svg.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
            clone.setAttribute('width', rect.width);
            clone.setAttribute('height', rect.height);
        }
        return new XMLSerializer().serializeToString(clone);
    }

    window.exportMermaidSVGs = function() {
        const diagrams = document.querySelectorAll('pre.mermaid svg');
        return Array.from(diagrams).map(function(svg, index) {
            return { index: index, svg: inlineSVGStyles(svg) };
        });
    };

    // Async PNG export — renders each diagram to canvas and posts results back
    // to Swift via window.webkit.messageHandlers.mermaidPNGExport.
    window.startMermaidPNGExport = function() {
        const diagrams = document.querySelectorAll('pre.mermaid svg');
        if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.mermaidPNGExport) {
            console.error('mermaidPNGExport message handler not available');
            return;
        }
        if (diagrams.length === 0) {
            window.webkit.messageHandlers.mermaidPNGExport.postMessage({diagrams: []});
            return;
        }

        const scale = window.devicePixelRatio || 2;
        const results = [];
        let completed = 0;

        function checkDone() {
            completed++;
            if (completed === diagrams.length) {
                results.sort(function(a, b) { return a.index - b.index; });
                window.webkit.messageHandlers.mermaidPNGExport.postMessage({diagrams: results});
            }
        }

        Array.from(diagrams).forEach(function(svg, index) {
            const rect = svg.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
                results.push({index: index, png: ''});
                checkDone();
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.ceil(rect.width * scale));
            canvas.height = Math.max(1, Math.ceil(rect.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.scale(scale, scale);

            const svgString = inlineSVGStyles(svg);
            const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, rect.width, rect.height);
                results.push({index: index, png: canvas.toDataURL('image/png')});
                checkDone();
            };
            img.onerror = function() {
                results.push({index: index, png: ''});
                checkDone();
            };
            img.src = dataUrl;
        });
    };
</script>
</body>
</html>
